# lab.docker.conf - para probar con los 3 contenedores de docker/docker-compose.yml
# (pc1=172.28.0.11, pc2=172.28.0.12, pc3=172.28.0.13). Debe ser identico en los 3 contenedores
# (ya lo es: viene copiado en la imagen).
[cluster]
name = kadp-dsm
hosts = 172.28.0.11,172.28.0.12,172.28.0.13
max_nodes = 3
max_nodes_per_host = 4
[memory]
page_size = 4096
node_memory = 16M
base_address = 0x600000000000
[network]
port_base = 28100
port_stride = 10
connect_timeout_ms = 2000
request_timeout_ms = 3000
max_retries = 3
connect_retry_ms = 500
[heartbeat]
interval_ms = 1000
suspect_after = 3
dead_after = 5
[cache]
max_cached_pages = 0
[log]
dir = ./logs
level = INFO
[web]
enabled = true
[extras]
replication_factor = 0
