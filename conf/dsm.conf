# dsm.conf - KADP-DSM (debe ser identico en todos los nodos)
[cluster]
name = kadp-dsm
hosts = 127.0.0.1
max_nodes = 8
max_nodes_per_host = 4
[memory]
page_size = 4096
node_memory = 1M
base_address = 0x600000000000
[network]
port_base = 50000 # confirmar rango asignado por el profesor
port_stride = 10
connect_timeout_ms = 2000
request_timeout_ms = 3000
max_retries = 3
connect_retry_ms = 500
[heartbeat]
interval_ms = 1000
suspect_after = 3
dead_after = 5
[cache]
max_cached_pages = 0
[log]
dir = ./logs
level = INFO
[web]
enabled = true
[extras]
replication_factor = 0
